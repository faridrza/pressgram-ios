settings:
  # PGRAM: APP_DISPLAY_NAME drives the Springboard label AND `OIDCConfiguration.clientName`
  # (read via `InfoPlistReader.main.bundleDisplayName`). Changing this to "Pressgram"
  # makes the MAS consent screen read "Continue to Pressgram?" instead of "Element X".
  # APP_GROUP_IDENTIFIER and BASE_BUNDLE_IDENTIFIER stay on `io.element.*` until
  # the AASA blocker is resolved — those are wired into Apple's universal-link
  # verification (current AASA covers `io.element.elementx` only) and extension
  # keychain access, so flipping them prematurely breaks login.
  APP_DISPLAY_NAME: Pressgram
  PRODUCTION_APP_NAME: Pressgram
  APP_GROUP_IDENTIFIER: group.io.element
  BASE_BUNDLE_IDENTIFIER: io.element.elementx
  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "colors/accent-color"
  DEVELOPMENT_TEAM: 7J4U792NQT

  # Optional configuration to load accounts from Element Classic.
  CLASSIC_APP_GROUP_IDENTIFIER: group.im.vector
  CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER: im.vector.app.encryption-manager-service
  CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).im.vector.app.keychain.shared"
  CLASSIC_APP_DEEP_LINK_URL: "element://open"
